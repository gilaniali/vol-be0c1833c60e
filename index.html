async function unlock(){
  const pw=document.getElementById('pw').value;
  try{
    const enc=new TextEncoder();
    const salt=Uint8Array.from(atob(D.salt),c=>c.charCodeAt(0));
    const iv=Uint8Array.from(atob(D.iv),c=>c.charCodeAt(0));
    const ct=Uint8Array.from(atob(D.ct),c=>c.charCodeAt(0));
    const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('err').style.display='block';
  }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')unlock()});
